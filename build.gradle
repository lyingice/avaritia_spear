plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.3.1'
group = 'net.avaritia.avaritiaspear'
archivesBaseName = 'AvaritiaSpear-1.20.1-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                jvmArgs += mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.toList()
            }
        }
        server {
        }

        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                avaritia_spear {
                    source sourceSets.main
                }
                // 注：不要用 source project(':spearcore').sourceSets.main 注册隔壁工程，
                // FML 认不出来（会报 spearcore [MISSING]）。spearcore 走下面的
                // runtimeOnly fg.deobf(...)，和 Avaritia 一样按普通 mod 加载。
            }
        }
    }
}

repositories {
    // 本地仓库：放 Re-Avaritia 的 1.20.1 构建产物（运行期要用 fg.deobf）
    maven {
        name = 'localMods'
        url = uri('libs/maven')
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 前置 spearcore（../spearcore-1.20.1）
    compileOnly project(':spearcore')

    // 前置 spearcore：编译用隔壁工程源码，运行期用反混淆后的 jar
    runtimeOnly fg.deobf('net.minecraft.spearcore:spearcore-1.20.1-forge:3.0.0')

    // 前置 Avaritia（Re-Avaritia forge/1.20.1 = 1.4.2，MIT 许可）
    // 放在 libs/maven 本地仓库里，编译/运行期用同一个坐标；
    // 运行期必须反混淆（mod jar 里存的是 SRG 名，开发环境是 Mojang 名）。
    compileOnly 'committee.nova.mods:avaritia-1.20.1:1.4.2'
    runtimeOnly fg.deobf('committee.nova.mods:avaritia-1.20.1:1.4.2')
}

mixin {
    add sourceSets.main, 'mixins.avaritia_spear.refmap.json'
    config 'avaritia_spear.mixins.json'
    quiet
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植期一次性看全所有错误，不要被 javac 的默认 100 条上限截断
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
