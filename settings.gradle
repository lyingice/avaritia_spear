pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

rootProject.name = 'avaritia_spear-1.20.1-forge'

// 前置 spearcore 用隔壁的 1.20.1 工程（同一套 official 1.20.1 映射）
include ':spearcore'
project(':spearcore').projectDir = file('../spearcore-1.20.1')
