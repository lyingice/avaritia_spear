#是否启用原版材质长矛（木、石、铁、金、钻石、下界合金）
#默认开启：会出现在创造模式物品栏，怪物生成时也会携带。
#关掉不影响合成与 /give——物品一直在，只是不在创造栏里、怪物也不带。
enableVanillaSpears = false
#是否启用铜长矛
#默认开启：会出现在创造模式物品栏，怪物生成时也会携带。
enableCopperSpear = false
#命中目标时给攻击者自己减速（水平速度 ×0.6）并取消奔跑，
#也就是原版那股"撞完得重新起跑"的手感。
#默认关闭：命中后保持速度与奔跑状态，撞完接着冲。
slowDownAttackerOnHit = false
#安装 Punchy 时，让其矛蓄力动画按本模组各材质的阶段(tick)切换；关闭则用 Punchy 自带的固定时间轴
punchyStageBridge = true

